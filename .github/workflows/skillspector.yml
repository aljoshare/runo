name: SkillSpector

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  skillspector:
    name: Scan Agent Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NVIDIA SkillSpector
        run: pip install git+https://github.com/NVIDIA/SkillSpector.git

      - name: Run SkillSpector SARIF analysis
        run: skillspector scan . --no-llm --format sarif --output skillspector.sarif
        continue-on-error: true

      - name: Run SkillSpector report summary
        run: skillspector scan . --no-llm

      - name: Upload SARIF report to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('skillspector.sarif') != ''
        with:
          sarif_file: skillspector.sarif
          category: skillspector

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('skillspector.sarif') != ''
        with:
          name: skillspector-sarif
          path: skillspector.sarif
          retention-days: 5
